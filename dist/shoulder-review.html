<!doctype html><html><meta charset="utf-8"><title>Shoulder fitting check</title><style>body{font:14px Arial;margin:12px}button{padding:10px}canvas{display:block}</style><button id="angle">Change angle</button><span>Roma, Boca, centenary Barcelona, PSG, Inter Miami, Cactus Jack</span><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {kits} from './kits.mjs';import {makeShirt} from './shirt-model.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(960,650);r.setClearColor(0xffffff);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=.85;document.body.append(r.domElement);const s=new THREE.Scene(),c=new THREE.OrthographicCamera(-5.1,5.1,3.5,-3.5,.1,50);c.position.z=10;s.add(new THREE.HemisphereLight(0xffffff,0x89918c,2.6));const key=new THREE.DirectionalLight(0xffffff,2.7);key.position.set(-5,8,7);s.add(key);const fill=new THREE.DirectionalLight(0xffffff,.8);fill.position.set(7,2,-4);s.add(fill);const draw=()=>r.render(s,c);const shirts=['02','11','13','14','17','18'].map((asset,j)=>{const i=kits.findIndex(k=>k.asset===asset),m=makeShirt(i,kits[i],draw);m.position.set((j%3-1)*3.3,j<3?1.7:-1.7,0);m.rotation.y=-1.2;s.add(m);return m;});let angle=0;document.querySelector('button').onclick=()=>{angle=(angle+1)%3;shirts.forEach(m=>m.rotation.y=[-1.2,0,Math.PI][angle]);draw();};draw();
</script></html>
